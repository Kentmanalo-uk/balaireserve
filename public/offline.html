<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fcfbf8" />
  <title>You're offline · Balai-Reserve</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/balai-icon-32.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(120% 80% at 50% 0%, #e7f3f0 0%, #fcfbf8 60%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2d2f; text-align: center;
    }
    main { max-width: 380px; }
    img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 12px 30px rgba(20, 52, 58, .18); }
    .wave { display: block; margin: 22px auto 6px; color: #0f5c66; opacity: .55; }
    h1 { margin: 6px 0 8px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.75rem; color: #14343a; }
    p { margin: 0 0 22px; line-height: 1.55; color: #50605f; }
    button {
      min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #0f5c66; color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 10px 22px rgba(15, 92, 102, .26);
    }
    button:focus-visible { outline: 3px solid #e0a73a; outline-offset: 3px; }
    .hint { margin-top: 18px; font-size: .8125rem; color: #7a8786; }
  </style>
</head>
<body>
  <main>
    <img src="/images/brand/balai-icon-96.png" alt="Balai-Reserve" width="96" height="96" />
    <svg class="wave" width="64" height="14" viewBox="0 0 64 14" fill="none" aria-hidden="true"><path d="M2 7c5 0 5-5 10-5s5 5 10 5 5-5 10-5 5 5 10 5 5-5 10-5 5 5 10 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h1>You're offline</h1>
    <p>We can't reach Balai-Reserve right now. Check your connection, and we'll pick up right where you left off.</p>
    <button type="button" id="retry">Try again</button>
    <p class="hint">Bookings and availability need a connection so you always see live dates and prices.</p>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
